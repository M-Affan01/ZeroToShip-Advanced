services:
  # ============================================
  # Infrastructure Services
  # ============================================
  redis-event-bus:
    image: redis:7.2-alpine
    container_name: redis-event-bus
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sentinel_postgres:
    image: postgres:16-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-S3nt1n3l#2026}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_sync}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/phase3_schema.sql:/docker-entrypoint-initdb.d/02-phase3.sql
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_admin} -d ${POSTGRES_DB:-sentinel_sync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sentinel_network

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # ============================================
  # Event Bus & WebSocket (Phase 5)
  # ============================================
  event-bus:
    build:
      context: ./services/event_bus
      dockerfile: Dockerfile
    container_name: event-bus
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - EVENT_CHANNELS=cis_events,content.events,equipment.events,notification.events,service.events
    depends_on:
      redis-event-bus:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('ioredis');const c=new r({host:'redis-event-bus',port:6379});c.ping().then(()=>{c.quit();process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  websocket:
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    container_name: websocket
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WS_PORT=8080
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - REDIS_CHANNEL=cis_events
      - HEARTBEAT_INTERVAL=30000
      - RECONNECT_ATTEMPTS=10
    depends_on:
      redis-event-bus:
        condition: service_healthy
      event-bus:
        condition: service_started
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Backend Services
  # ============================================
  auth-api:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: auth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-S3nt1n3l%232026}@sentinel_postgres:5432/${POSTGRES_DB:-sentinel_sync}
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MAX_FAILED_ATTEMPTS=${MAX_FAILED_ATTEMPTS:-5}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-15}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-5}
    depends_on:
      redis-event-bus:
        condition: service_healthy
      sentinel_postgres:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  content-service:
    build:
      context: ./services/content_service
      dockerfile: Dockerfile
    container_name: content-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-S3nt1n3l%232026}@sentinel_postgres:5432/${POSTGRES_DB:-sentinel_sync}
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SERVICE_NAME=content-service
      - SERVICE_PORT=8001
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      redis-event-bus:
        condition: service_healthy
      sentinel_postgres:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ai-assistant:
    build:
      context: ./services/ai_assistant
      dockerfile: Dockerfile
    container_name: ai-assistant
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-S3nt1n3l%232026}@sentinel_postgres:5432/${POSTGRES_DB:-sentinel_sync}
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SERVICE_NAME=ai-assistant
      - SERVICE_PORT=8002
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-campus_guidelines}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - VECTOR_TOP_K=${VECTOR_TOP_K:-5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.65}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      redis-event-bus:
        condition: service_healthy
      sentinel_postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # API Gateway (Phase 5)
  # ============================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_PORT=3000
      - AUTH_SERVICE_URL=http://auth-api:8000
      - CONTENT_SERVICE_URL=http://content-service:8001
      - AI_SERVICE_URL=http://ai-assistant:8002
      - REDIS_HOST=redis-event-bus
      - REDIS_PORT=6379
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      auth-api:
        condition: service_healthy
      content-service:
        condition: service_healthy
      ai-assistant:
        condition: service_healthy
      websocket:
        condition: service_healthy
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Frontend (Phase 5)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      websocket:
        condition: service_healthy
    networks:
      - sentinel_network

networks:
  sentinel_network:
    driver: bridge
    name: sentinel_network
